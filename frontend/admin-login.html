<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lucky Ones Library | Admin Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="login-wrapper">
    <div class="login-box">

        <!-- Logo -->
        <div class="logo-big">✨ LUCKY ONES LIBRARY</div>
        <p>Admin Access Only</p>

        <!-- Error Message -->
        <div class="login-error" id="loginError">
            <i class="fas fa-exclamation-circle"></i> Invalid email or password.
        </div>

        <!-- Email -->
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="adminEmail" placeholder="Enter your email" autocomplete="off">
        </div>

        <!-- Password -->
        <div class="form-group" style="margin-bottom: 28px;">
            <label>Password</label>
            <div style="position: relative;">
                <input type="password" id="adminPassword" placeholder="Enter your password" autocomplete="off" style="padding-right: 44px;">
                <button onclick="togglePassword()" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.95rem;">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <!-- Login Button -->
        <button class="btn-primary" onclick="adminLogin()" style="width: 100%; justify-content: center;">
            <i class="fas fa-sign-in-alt"></i> &nbsp; LOGIN
        </button>

        <!-- Back to Home -->
        <div style="margin-top: 24px;">
            <a href="index.html" style="color: var(--text-muted); font-size: 0.82rem; text-decoration: none; letter-spacing: 1px; text-transform: uppercase; transition: color 0.3s;">
                <i class="fas fa-arrow-left"></i> &nbsp; Back to Website
            </a>
        </div>

    </div>
</div>

<script>
    // ============================================
    // ADMIN CREDENTIALS (Change these!)
    // ============================================
    const ADMIN_EMAIL    = 'niyonteze72@gmail.com';
    const ADMIN_PASSWORD = 'Lucky!123@';

    function adminLogin() {
        const email    = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value.trim();
        const errorBox = document.getElementById('loginError');

        if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
            // Save session
            sessionStorage.setItem('isAdmin', 'true');
            errorBox.style.display = 'none';
            window.location.href = 'index.html';
        } else {
            errorBox.style.display = 'block';
        }
    }

    // Allow pressing Enter to login
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') adminLogin();
    });

    function togglePassword() {
        const input   = document.getElementById('adminPassword');
        const icon    = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // If already logged in, redirect
    if (sessionStorage.getItem('isAdmin') === 'true') {
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
